<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- बड़ी ख़बर (BADI KHABAR) - Deep Navy & Bright Gold Broadcast Plate -->
  <defs>
    <linearGradient id="navyPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF04B"/>
      <stop offset="50%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="badiShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-text-upright {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Top Gold speed line -->
  <rect x="180" y="10" width="600" height="6" rx="3" fill="#FFD000"/>
  <rect x="270" y="20" width="420" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
  
  <g filter="url(#badiShadow)">
    <!-- Base Plate Shadow -->
    <polygon points="142,34 818,34 788,144 112,144" fill="#000000" opacity="0.25"/>

    <!-- Left Navy 'बड़ी' Box -->
    <polygon points="148,36 415,36 385,142 118,142" fill="url(#navyPlateGrad)" stroke="#FFD000" stroke-width="3.5"/>

    <!-- Right Gold 'ख़बर' Box -->
    <polygon points="423,36 812,36 782,142 393,142" fill="url(#goldPlateGrad)" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- Left Saffron Highlight Strip -->
    <polygon points="158,44 178,44 158,134 138,134" fill="#FF6B00" opacity="0.9"/>
    <!-- Right Green Highlight Strip -->
    <polygon points="798,44 804,44 776,134 770,134" fill="#16A34A" opacity="0.9"/>

    <!-- Text: बड़ी - 100% Upright, pure white with gold outline -->
    <text
      x="285"
      y="90"
      fill="#FFFFFF"
      class="ribbon-text-upright"
      font-size="72"
    >बड़ी</text>

    <!-- Text: ख़बर - 100% Upright, bold deep black -->
    <text
      x="600"
      y="90"
      fill="#0A0A0A"
      class="ribbon-text-upright"
      font-size="72"
    >ख़बर</text>
  </g>

  <!-- Bottom Gold speed line -->
  <rect x="270" y="152" width="420" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
  <rect x="210" y="160" width="540" height="6" rx="3" fill="#FFD000"/>
</svg>
