<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- ताज़ा ख़बर (TAZA KHABAR) - High-Impact Broadcast Yellow & Jet Black -->
  <defs>
    <linearGradient id="tazaYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF04B"/>
      <stop offset="50%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#F5B700"/>
    </linearGradient>
    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="tazaShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-text-upright {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 3px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Top Yellow Accent Line -->
  <rect x="200" y="10" width="560" height="7" rx="3.5" fill="#FFE600"/>
  <rect x="280" y="20" width="400" height="4" rx="2" fill="#DC2626"/>

  <g filter="url(#tazaShadow)">
    <!-- Base Plate Background with Beveled Cuts -->
    <polygon points="175,34 785,34 755,144 145,144" fill="#000000" opacity="0.25"/>

    <!-- Main Yellow Plate -->
    <polygon points="180,36 780,36 750,142 150,142" fill="url(#tazaYellowGrad)" stroke="#000000" stroke-width="4"/>

    <!-- Left Red Chevron Flag -->
    <polygon points="168,44 195,44 175,134 148,134" fill="url(#redAccentGrad)"/>

    <!-- Right Red Chevron Flag -->
    <polygon points="762,44 742,44 722,134 742,134" fill="url(#redAccentGrad)"/>

    <!-- Left Speed Pinstripes -->
    <line x1="208" y1="46" x2="190" y2="132" stroke="#000000" stroke-width="3" opacity="0.35"/>
    <!-- Right Speed Pinstripes -->
    <line x1="728" y1="46" x2="710" y2="132" stroke="#000000" stroke-width="3" opacity="0.35"/>

    <!-- Text: 'ताज़ा ख़बर' - 100% Upright, Generous Letter Spacing, No Matra Collision! -->
    <text
      x="465"
      y="90"
      fill="#000000"
      class="ribbon-text-upright"
      font-size="74"
    >ताज़ा ख़बर</text>
  </g>

  <!-- Bottom Yellow Accent Line -->
  <rect x="280" y="152" width="400" height="4" rx="2" fill="#DC2626"/>
  <rect x="230" y="160" width="500" height="6" rx="3" fill="#FFE600"/>
</svg>
