<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- High-Impact Super Breaking (सुपर ब्रेकिंग) - Pristine Devanagari, Zero Glyph Collision -->
  <defs>
    <linearGradient id="vibrantRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="45%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="whitePlateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="50%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="ribbonShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-text-upright {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Top Speed Accent Lines -->
  <rect x="180" y="10" width="600" height="6" rx="3" fill="#DC2626"/>
  <rect x="270" y="20" width="420" height="4" rx="2" fill="url(#goldBorderGrad)"/>

  <g filter="url(#ribbonShadow)">
    <!-- Base Plate Outline Silhouette -->
    <polygon points="142,34 818,34 788,144 112,144" fill="#000000" opacity="0.25"/>

    <!-- Left White Plate: 'सुपर' (Slanted Bevel) -->
    <polygon points="148,36 415,36 385,142 118,142" fill="url(#whitePlateGrad)" stroke="#DC2626" stroke-width="3.5"/>
    
    <!-- Right Vibrant Red Plate: 'ब्रेकिंग' (Slanted Bevel) -->
    <polygon points="423,36 812,36 782,142 393,142" fill="url(#vibrantRedGrad)" stroke="url(#goldBorderGrad)" stroke-width="3.5"/>

    <!-- Left Red Gem Indicator -->
    <polygon points="158,44 178,44 158,134 138,134" fill="#DC2626" opacity="0.85"/>
    
    <!-- Right Gold Gem Indicator -->
    <polygon points="798,44 804,44 776,134 770,134" fill="#FFE600" opacity="0.90"/>

    <!-- Text: 'सुपर' - 100% Upright, Generous Letter Spacing, No Matra Collision! -->
    <text
      x="285"
      y="90"
      fill="#DC2626"
      class="ribbon-text-upright"
      font-size="70"
    >सुपर</text>

    <!-- Text: 'ब्रेकिंग' - 100% Upright, Crystal Clear Devanagari Conjuncts! -->
    <text
      x="600"
      y="90"
      fill="#FFFFFF"
      class="ribbon-text-upright"
      font-size="70"
    >ब्रेकिंग</text>
  </g>

  <!-- Bottom Speed Accent Lines -->
  <rect x="270" y="152" width="420" height="4" rx="2" fill="url(#goldBorderGrad)"/>
  <rect x="210" y="160" width="540" height="6" rx="3" fill="#DC2626"/>
</svg>
