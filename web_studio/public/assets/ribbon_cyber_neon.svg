<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="100%">
  <!-- Cyber / High-Tech Neon Breaking News Ribbon -->
  <defs>
    <filter id="neonGlowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#EF4444" flood-opacity="0.8"/>
    </filter>
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Glowing cyan top accent -->
  <rect x="50" y="8" width="420" height="4" fill="#06B6D4" rx="1" filter="url(#neonGlowCyan)" />
  <!-- Glowing red top accent -->
  <rect x="490" y="8" width="420" height="4" fill="#EF4444" rx="1" filter="url(#neonGlowRed)" />

  <g transform="translate(45, 0) skewX(-15)">
    <!-- Glossy Midnight Black Plaque -->
    <rect x="50" y="18" width="840" height="110" rx="3" fill="#090A0F" stroke="#1E293B" stroke-width="2" />
    
    <!-- Left Accent Box: टॉप -->
    <rect x="54" y="22" width="416" height="102" rx="2" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />

    <!-- Right Accent Box: न्यूज़ -->
    <rect x="474" y="22" width="412" height="102" rx="2" fill="#991B1B" stroke="#EF4444" stroke-width="2" />

    <!-- Text टॉप -->
    <text
      x="262"
      y="93"
      fill="#FFFFFF"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="66"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >टॉप</text>

    <!-- Text न्यूज़ -->
    <text
      x="680"
      y="93"
      fill="#FFFFFF"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="66"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >न्यूज़</text>
  </g>

  <!-- Glowing bottom lines -->
  <rect x="180" y="136" width="340" height="4" fill="#06B6D4" rx="1" filter="url(#neonGlowCyan)" />
  <rect x="540" y="136" width="340" height="4" fill="#EF4444" rx="1" filter="url(#neonGlowRed)" />
</svg>
