<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- LIVE UPDATE (लाइव अपडेट) - Pulsing Live Indicator & Pure White Plate -->
  <defs>
    <linearGradient id="liveRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="liveWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="liveShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-text-upright {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Top Red Speed Bar -->
  <rect x="180" y="10" width="600" height="6" rx="3" fill="#DC2626"/>
  <rect x="270" y="20" width="420" height="4" rx="2" fill="#FFE600"/>

  <g filter="url(#liveShadow)">
    <polygon points="142,34 818,34 788,144 112,144" fill="#000000" opacity="0.25"/>

    <!-- Left Plate: '🔴 LIVE' -->
    <polygon points="148,36 430,36 400,142 118,142" fill="url(#liveRedGrad)" stroke="#FFE600" stroke-width="3.5"/>
    
    <!-- Right Plate: 'अपडेट' -->
    <polygon points="438,36 812,36 782,142 408,142" fill="url(#liveWhiteGrad)" stroke="#DC2626" stroke-width="3.5"/>

    <!-- White Pulsing Dot for LIVE -->
    <circle cx="215" cy="89" r="12" fill="#FFFFFF"/>
    <circle cx="215" cy="89" r="6" fill="#DC2626"/>

    <!-- Text: 'LIVE' -->
    <text
      x="315"
      y="91"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="62"
      letter-spacing="3px"
      text-anchor="middle"
      dominant-baseline="central"
    >LIVE</text>

    <!-- Text: 'अपडेट' - Upright Devanagari in Bold Red -->
    <text
      x="605"
      y="90"
      fill="#DC2626"
      class="ribbon-text-upright"
      font-size="72"
    >अपडेट</text>
  </g>

  <!-- Bottom Accent Lines -->
  <rect x="270" y="152" width="420" height="4" rx="2" fill="#FFE600"/>
  <rect x="210" y="160" width="540" height="6" rx="3" fill="#DC2626"/>
</svg>
