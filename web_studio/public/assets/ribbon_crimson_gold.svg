<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- Luxury Crimson & Metallic Gold Broadcast Ribbon -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="deepCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="50%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-hindi {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 0;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Gold Accent Header Bar -->
  <rect x="180" y="14" width="600" height="6" fill="url(#goldGrad)" rx="2"/>

  <g transform="translate(30, 0) skewX(-14)">
    <!-- Left Crimson Box: 'एक्सक्लूसिव' -->
    <rect x="130" y="36" width="375" height="106" rx="4" fill="url(#deepCrimson)" stroke="url(#goldGrad)" stroke-width="3" />
    
    <!-- Right Gold Box: 'EXCLUSIVE' -->
    <rect x="510" y="36" width="310" height="106" rx="4" fill="#171717" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Text: एक्सक्लूसिव -->
    <text
      x="317"
      y="91"
      fill="#FFFFFF"
      class="ribbon-hindi"
      font-size="68"
    >एक्सक्लूसिव</text>

    <!-- Text: EXCLUSIVE with Gold Tint -->
    <text
      x="665"
      y="91"
      fill="#FEF08A"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Arial Black', Impact, sans-serif"
      font-size="52"
      font-style="italic"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
      dominant-baseline="central"
    >EXCLUSIVE</text>
  </g>

  <!-- Gold Bottom Accent Line -->
  <rect x="220" y="156" width="520" height="5" fill="url(#goldGrad)" rx="2"/>
</svg>

