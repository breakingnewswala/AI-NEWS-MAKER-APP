<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- सच का खुलासा (FACT CHECK / पड़ताल) - Sleek Carbon Black & Radiant Amber -->
  <defs>
    <linearGradient id="factBlackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="factAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="factShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-text-upright {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Top Amber Line -->
  <rect x="180" y="10" width="600" height="6" rx="3" fill="#EAB308"/>
  <rect x="270" y="20" width="420" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>

  <g filter="url(#factShadow)">
    <polygon points="142,34 818,34 788,144 112,144" fill="#000000" opacity="0.25"/>

    <!-- Left Plate: 'पड़ताल' (Black & Gold Trim) -->
    <polygon points="148,36 410,36 380,142 118,142" fill="url(#factBlackGrad)" stroke="#EAB308" stroke-width="3.5"/>
    
    <!-- Right Plate: 'सच का खुलासा' (Golden Amber Plate) -->
    <polygon points="418,36 812,36 782,142 388,142" fill="url(#factAmberGrad)" stroke="#0A0A0A" stroke-width="3.5"/>

    <!-- Left Cyan Glow Accent -->
    <polygon points="158,44 178,44 158,134 138,134" fill="#38BDF8" opacity="0.9"/>

    <!-- Text: 'पड़ताल' - Upright White -->
    <text
      x="275"
      y="90"
      fill="#FFFFFF"
      class="ribbon-text-upright"
      font-size="68"
    >पड़ताल</text>

    <!-- Text: 'सच का खुलासा' - Upright Black -->
    <text
      x="595"
      y="90"
      fill="#0A0A0A"
      class="ribbon-text-upright"
      font-size="62"
    >सच का खुलासा</text>
  </g>

  <!-- Bottom Amber Line -->
  <rect x="270" y="152" width="420" height="4" rx="2" fill="#FFFFFF" opacity="0.8"/>
  <rect x="210" y="160" width="540" height="6" rx="3" fill="#EAB308"/>
</svg>
