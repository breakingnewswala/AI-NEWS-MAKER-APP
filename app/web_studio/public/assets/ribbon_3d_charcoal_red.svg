<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="100%">
  <!-- 3D Charcoal & Crimson Plaque -->
  <defs>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2127"/>
      <stop offset="50%" stop-color="#16171B"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Top accent bars -->
  <rect x="40" y="8" width="380" height="4" fill="rgba(255,255,255,0.9)" rx="1"/>
  <rect x="440" y="8" width="480" height="5" fill="#EF4444" rx="1"/>

  <g transform="translate(45, 0) skewX(-14)">
    <!-- Left Charcoal: SPECIAL -->
    <rect x="40" y="20" width="430" height="98" rx="3" fill="url(#charcoalGrad)" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" />
    <rect x="65" y="106" width="380" height="5" fill="#DC2626" rx="1" />

    <!-- Right Crimson: REPORT -->
    <rect x="465" y="16" width="405" height="106" rx="3" fill="url(#crimsonGrad)" stroke="#FCA5A5" stroke-width="2.5" />

    <!-- Text SPECIAL -->
    <text
      x="255"
      y="88"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Arial Black', Impact, sans-serif"
      font-size="52"
      font-style="italic"
      font-weight="900"
      letter-spacing="3"
      text-anchor="middle"
    >SPECIAL</text>

    <!-- Text REPORT -->
    <text
      x="667"
      y="91"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Arial Black', Impact, sans-serif"
      font-size="56"
      font-style="italic"
      font-weight="900"
      letter-spacing="3"
      text-anchor="middle"
    >REPORT</text>
  </g>
</svg>
