<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 950 380" width="950" height="380">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="badgeYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FFDD00" />
    </linearGradient>

    <!-- Globe Sphere Shading -->
    <radialGradient id="hGlobeSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="60%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </radialGradient>
  </defs>

  <!-- Right Yellow Badge with rounded top-right corner and red border -->
  <path d="M 280 20 L 850 20 C 930 20 950 40 950 120 L 950 365 L 280 365 Z" fill="url(#badgeYellow)" stroke="#DC2626" stroke-width="8" stroke-linejoin="round" />

  <!-- Left Circular Globe (overlapping badge) -->
  <g transform="translate(200, 200)">
    <!-- Globe Circle -->
    <circle cx="0" cy="0" r="185" fill="url(#hGlobeSphere)" stroke="#DC2626" stroke-width="8" />

    <!-- Grid lines (latitudes & longitudes) -->
    <ellipse cx="0" cy="0" rx="135" ry="183" fill="none" stroke="#CA8A04" stroke-width="3" opacity="0.8" />
    <ellipse cx="0" cy="0" rx="70" ry="183" fill="none" stroke="#CA8A04" stroke-width="3" opacity="0.8" />
    <line x1="0" y1="-185" x2="0" y2="185" stroke="#CA8A04" stroke-width="3" opacity="0.8" />
    <line x1="-183" y1="0" x2="183" y2="0" stroke="#CA8A04" stroke-width="3.5" opacity="0.9" />
    <ellipse cx="0" cy="-70" rx="170" ry="38" fill="none" stroke="#CA8A04" stroke-width="3" opacity="0.75" />
    <ellipse cx="0" cy="70" rx="170" ry="38" fill="none" stroke="#CA8A04" stroke-width="3" opacity="0.75" />

    <!-- Continents in Royal Blue -->
    <!-- Africa & Middle East -->
    <path d="M -25 -20 C -20 -50 18 -60 42 -40 C 65 -25 55 25 48 60 C 40 92 10 118 -8 122 C -30 115 -48 76 -38 42 C -25 25 -30 0 -25 -20 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" />
    <!-- Europe -->
    <path d="M -50 -65 C -36 -95 10 -102 26 -80 C 38 -68 18 -50 -8 -54 C -25 -60 -40 -48 -50 -65 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2" />
    <!-- Asia / India -->
    <path d="M 30 -75 C 60 -92 110 -76 128 -42 C 136 -16 110 25 85 30 C 72 48 55 65 48 72 C 40 60 52 30 60 8 C 42 -16 20 -42 30 -75 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.5" />
    <!-- Western edge hints -->
    <path d="M -125 -70 C -100 -78 -92 -42 -118 -16 C -138 8 -148 -35 -125 -70 Z" fill="#2563EB" opacity="0.85" />
    <path d="M -120 25 C -105 50 -110 92 -132 100 C -144 75 -138 42 -120 25 Z" fill="#2563EB" opacity="0.85" />
  </g>

  <!-- Typography Inside Yellow Banner -->
  <g transform="translate(420, 0)">
    <!-- "ब्रेकिंग" -->
    <text x="210" y="195" text-anchor="middle" font-family="'Baloo 2', 'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="124" font-weight="900" fill="#DC2626" stroke="#991B1B" stroke-width="2.5" letter-spacing="-1">
      ब्रेकिंग
    </text>

    <!-- "न्यूजवाला" -->
    <text x="210" y="305" text-anchor="middle" font-family="'Baloo 2', 'Noto Sans Devanagari', 'Mukta', sans-serif" font-size="118" font-weight="900" fill="#DC2626" stroke="#991B1B" stroke-width="2.5" letter-spacing="-1">
      न्यूजवाला
    </text>

    <!-- Thin red divider line -->
    <line x1="-30" y1="330" x2="490" y2="330" stroke="#DC2626" stroke-width="4.5" stroke-linecap="round" />

    <!-- Tagline: "भारत के जिलों से, आपके दिलों तक" -->
    <text x="225" y="365" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="34" font-weight="800" fill="#18181B">
      भारत के जिलों से, आपके दिलों तक
    </text>
  </g>
</svg>