<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <!-- महा ब्रेकिंग (MAHA BREAKING) - Crimson Red & Neon Amber -->
  <defs>
    <linearGradient id="mahaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="mahaYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF200"/>
      <stop offset="50%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="mahaShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800;900&amp;display=swap');
    .ribbon-text-upright {
      font-family: 'Baloo 2', 'Noto Sans Devanagari', -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Top Yellow bar -->
  <rect x="180" y="10" width="600" height="6" rx="3" fill="#FFF200"/>
  <rect x="260" y="20" width="440" height="4" rx="2" fill="#FF1A1A"/>

  <g filter="url(#mahaShadow)">
    <!-- Base Plate Shadow -->
    <polygon points="142,34 818,34 788,144 112,144" fill="#000000" opacity="0.25"/>

    <!-- Left Red Plate: 'महा' -->
    <polygon points="148,36 415,36 385,142 118,142" fill="url(#mahaRedGrad)" stroke="#FFF200" stroke-width="3.5"/>

    <!-- Right Yellow Plate: 'ब्रेकिंग' -->
    <polygon points="423,36 812,36 782,142 393,142" fill="url(#mahaYellowGrad)" stroke="#000000" stroke-width="3.5"/>

    <!-- Accent Highlights -->
    <polygon points="158,44 178,44 158,134 138,134" fill="#FFF200" opacity="0.85"/>
    <polygon points="798,44 804,44 776,134 770,134" fill="#E50914" opacity="0.90"/>

    <!-- Text: महा - Upright, bold white -->
    <text
      x="285"
      y="90"
      fill="#FFFFFF"
      class="ribbon-text-upright"
      font-size="72"
    >महा</text>

    <!-- Text: ब्रेकिंग - Upright, pure bold black -->
    <text
      x="600"
      y="90"
      fill="#0A0A0A"
      class="ribbon-text-upright"
      font-size="70"
    >ब्रेकिंग</text>
  </g>

  <!-- Bottom Yellow bar -->
  <rect x="260" y="152" width="440" height="4" rx="2" fill="#FF1A1A"/>
  <rect x="210" y="160" width="540" height="6" rx="3" fill="#FFF200"/>
</svg>
