# Firebase App Hosting Configuration
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: "production"
    availability:
      - BUILD
      - RUNTIME
  - variable: GOOGLE_NODE_RUN_SCRIPTS
    value: ""
    availability:
      - BUILD


