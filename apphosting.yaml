# Firebase App Hosting Configuration
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: "production"
    availability:
      - RUNTIME
  - variable: USE_FIRESTORE
    value: "true"
    availability:
      - RUNTIME
  - variable: FIRESTORE_DATABASE_ID
    value: "ai-studio-ainewsmakerapp-dc75889d-179d-4f39-b479-76519c8874bd"
    availability:
      - RUNTIME
  - variable: USE_GCS
    value: "true"
    availability:
      - RUNTIME
  - variable: STORAGE_BUCKET
    value: "ai-news-maker-app.firebasestorage.app"
    availability:
      - RUNTIME
  - variable: NPM_CONFIG_PRODUCTION
    value: "false"
    availability:
      - BUILD
  - variable: CASHFREE_APP_ID
    secret: CASHFREE_APP_ID
    availability:
      - RUNTIME
  - variable: CASHFREE_SECRET_KEY
    secret: CASHFREE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: CASHFREE_ENVIRONMENT
    value: "PRODUCTION"
    availability:
      - RUNTIME
  - variable: WHATSAPP_TASK_QUEUE_LOCATION
    value: "asia-east1"
    availability:
      - RUNTIME
  - variable: WHATSAPP_TASK_QUEUE
    value: "whatsapp-inbound-v2"
    availability:
      - RUNTIME
  - variable: WHATSAPP_TASK_SERVICE_ACCOUNT
    value: "whatsapp-task-worker@ai-news-maker-app.iam.gserviceaccount.com"
    availability:
      - RUNTIME
  - variable: WHATSAPP_TASK_BASE_URL
    value: "https://ainewsmakerapp--ai-news-maker-app.asia-east1.hosted.app"
    availability:
      - RUNTIME
  - variable: WHATSAPP_PHONE_NUMBER_ID
    value: "1474022642460639"
    availability:
      - RUNTIME
  - variable: WHATSAPP_GRAPH_API_VERSION
    value: "v21.0"
    availability:
      - RUNTIME
  - variable: WHATSAPP_GEMINI_MODEL
    value: "gemini-3.5-flash"
    availability:
      - RUNTIME
  - variable: WHATSAPP_AI_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: META_APP_SECRET
    secret: META_APP_SECRET
    availability:
      - RUNTIME
  - variable: META_WEBHOOK_VERIFY_TOKEN
    secret: META_WEBHOOK_VERIFY_TOKEN
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
